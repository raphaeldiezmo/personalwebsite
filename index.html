<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#260c14">
  <meta name="description" content="Angelina Sofia Yankova, I love you.">
  <title>Angelina Sofia Yankova, I love you</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5e9e7;
      --rose: #c64b5c;
      --gold: #d1a363;
      --ease: cubic-bezier(.2,.75,.25,1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; background: #12070c; }
    body {
      min-height: 100svh; margin: 0; overflow-x: hidden; color: var(--ink);
      font-family: 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif;
      background: radial-gradient(ellipse at 50% 44%, #40131c 0%, #260c14 43%, #12070c 100%);
    }
    .page {
      position: relative; isolation: isolate; min-height: 100svh;
      display: grid; grid-template-rows: 1fr auto; justify-items: center;
      padding: clamp(28px, 6vh, 64px) 20px 24px;
    }
    .page::before, .page::after {
      position: absolute; z-index: -1; width: min(35vw, 420px); aspect-ratio: 1;
      border: 1px solid rgba(209,163,99,.13); border-radius: 50%; content: '';
      pointer-events: none;
    }
    .page::before { top: 7%; left: -22%; }
    .page::after { right: -24%; bottom: 4%; width: min(42vw, 500px); }
    main {
      width: min(100%, 1050px); min-height: 0; align-self: center; display: flex;
      flex-direction: column; align-items: center; text-align: center;
    }
    h1 {
      margin: 0; max-width: 100%; font-size: clamp(2.25rem, 8.6vw, 6rem);
      font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 800;
      letter-spacing: -.065em; line-height: 1.04;
      text-wrap: balance; opacity: 0; transform: translateY(22px);
      animation: type-in .9s .18s var(--ease) forwards;
    }
    h1 span, .note {
      color: #f3a1a6;
      background: linear-gradient(105deg, #ffb7b4 0%, #ee6a76 22%, #b52d46 46%, #4b081b 69%, #c83c51 86%, #ffb7b4 100%);
      background-size: 260% 100%;
      background-clip: text; -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: wine-glow 7s ease-in-out infinite alternate;
    }
    h1 span { font-style: normal; }
    .bouquet {
      display: block; width: min(100%, 760px); height: auto; max-height: 68svh; overflow: visible;
      margin: clamp(4px, 1.5vh, 18px) auto clamp(2px, 1vh, 12px);
      opacity: 1; transform: none;
    }
    .flower-sway { transform-box: fill-box; transform-origin: center bottom; animation: flower-sway 5.8s ease-in-out infinite; }
    .flower-bloom { opacity: 0; transform-box: fill-box; transform-origin: center; }
    .flower-bloom.is-open { animation: bloom-open .62s var(--ease) both; }
    .sparkle { transform-box: fill-box; transform-origin: center; animation: shimmer 3.2s ease-in-out infinite; }
    .sparkle:nth-of-type(2n) { animation-delay: -1.5s; }
    .note {
      margin: 0; color: #f0d8d5; font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: clamp(1.8rem, 5.8vw, 3.25rem); font-weight: 750; letter-spacing: -.035em; opacity: 0;
      animation: type-in .9s 3.55s var(--ease) both, wine-glow 7s ease-in-out infinite alternate;
    }
    .typed-message::after {
      display: inline-block; width: 2px; height: .84em; margin-left: .12em;
      background: #f06b78; content: ''; vertical-align: -.04em;
      animation: caret-blink .8s steps(2, start) infinite;
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    footer {
      width: 100%; padding-top: 25px; border-top: 1px solid rgba(240,216,213,.18);
      color: #c9aaa9; text-align: center; font: 500 .67rem/1.6 system-ui, sans-serif;
      letter-spacing: .16em; text-transform: uppercase;
      opacity: 0; animation: type-in .8s 3.85s var(--ease) both;
    }
    @keyframes type-in { from { opacity: 0; transform: translateY(22px); filter: blur(7px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
    @keyframes wine-glow { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
    @keyframes caret-blink { to { opacity: 0; } }
    @keyframes bloom-open { 0% { opacity: 0; transform: scale(.08) rotate(-24deg); } 70% { opacity: 1; transform: scale(1.12) rotate(5deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes flower-sway { 0%,100% { transform: rotate(-1.1deg); } 50% { transform: rotate(1.1deg); } }
    @keyframes shimmer { 0%,100% { opacity: .38; transform: scale(.8); } 50% { opacity: .95; transform: scale(1.12); } }
    @media (min-height: 820px) { .page { padding-top: 7vh; padding-bottom: 30px; } .bouquet { width: min(100%, 820px); max-height: 70svh; } }
    @media (max-width: 420px) {
      .page { padding: 34px 18px 20px; }
      .bouquet { width: min(110%, 520px); max-height: 57svh; margin-block: 12px 8px; }
      footer { padding-top: 16px; font-size: .62rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      h1, .bouquet, .note, footer { opacity: 1; transform: none; filter: none; }
      .flower-bloom { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <main>
      <h1><span>Angelina Sofia Yankova</span></h1>
      <svg class="bouquet" viewBox="0 0 600 620" role="img" aria-label="A bouquet of colourful brick-built flowers" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="wrapper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a83b4c"/><stop offset=".5" stop-color="#702333"/><stop offset="1" stop-color="#431521"/></linearGradient>
          <linearGradient id="wrapper-fold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d05a62"/><stop offset="1" stop-color="#8a293c"/></linearGradient>
          <g id="brick-petal">
            <path d="M-13-17C-22-29-31-43-27-57-24-72-9-80 0-82 9-80 24-72 27-57 31-43 22-29 13-17Q0-10-13-17Z" fill="currentColor" stroke="#fff3e8" stroke-opacity=".48" stroke-width="2.5"/>
            <path d="M-18-49C-18-63-9-72 0-75" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
            <circle cx="0" cy="-57" r="8.5" fill="currentColor" stroke="#fff3e8" stroke-opacity=".55" stroke-width="2"/>
            <ellipse cx="-2" cy="-60" rx="3.2" ry="1.8" fill="#fff" opacity=".28"/>
          </g>
          <g id="brick-flower">
            <g fill="currentColor">
              <use href="#brick-petal"/><use href="#brick-petal" transform="rotate(60)"/><use href="#brick-petal" transform="rotate(120)"/>
              <use href="#brick-petal" transform="rotate(180)"/><use href="#brick-petal" transform="rotate(240)"/><use href="#brick-petal" transform="rotate(300)"/>
            </g>
            <circle r="25" fill="#f5bd35" stroke="#ffe6a0" stroke-width="3"/>
            <g fill="#ffd45d" stroke="#d89422" stroke-width="1.5"><circle cx="-9" cy="-8" r="6"/><circle cx="9" cy="-8" r="6"/><circle cx="-9" cy="9" r="6"/><circle cx="9" cy="9" r="6"/></g>
          </g>
          <g id="brick-leaf">
            <path d="M0 0 0-48Q0-56 8-56h25q8 0 8 8v16q0 8-8 8H14v24Z" fill="currentColor" stroke="#d9efb0" stroke-opacity=".6" stroke-width="2"/>
            <circle cx="21" cy="-44" r="6" fill="#c8e995"/><circle cx="21" cy="-44" r="3" fill="#edffc9" opacity=".8"/>
          </g>
        </defs>

        <!-- Sturdy stems meet inside the wrapper; brick leaves branch from the bouquet. -->
        <g fill="none" stroke="#527f4b" stroke-width="13" stroke-linecap="round">
          <path d="M190 166Q215 302 277 441"/><path d="M300 115Q300 287 300 442"/><path d="M410 166Q384 304 323 441"/>
          <path d="M145 270Q205 350 280 444"/><path d="M455 270Q395 350 320 444"/><path d="M300 253Q300 350 300 442"/>
        </g>
        <g fill="none" stroke="#a4cf72" stroke-width="3" stroke-linecap="round" opacity=".82">
          <path d="M190 170Q218 310 278 435"/><path d="M300 120V435"/><path d="M410 170Q382 310 322 435"/><path d="M145 275Q208 355 281 438"/><path d="M455 275Q392 355 319 438"/>
        </g>
        <g fill="#79a858" stroke="#426d40" stroke-width="2">
          <rect x="269" y="430" width="62" height="18" rx="6"/><circle cx="282" cy="439" r="4" fill="#b8d77c"/><circle cx="318" cy="439" r="4" fill="#b8d77c"/>
          <use href="#brick-leaf" transform="translate(222 330) rotate(-53)"/><use href="#brick-leaf" transform="translate(380 338) rotate(45) scale(-1 1)"/>
          <use href="#brick-leaf" transform="translate(185 365) rotate(-57) scale(.8)"/><use href="#brick-leaf" transform="translate(415 368) rotate(53) scale(-.8 .8)"/>
          <use href="#brick-leaf" transform="translate(286 303) rotate(-43) scale(.78)"/><use href="#brick-leaf" transform="translate(315 330) rotate(44) scale(-.78 .78)"/>
        </g>

        <!-- Blooms are deliberately layered over their own stem tips and inside the bouquet silhouette. -->
        <g transform="translate(190 166)"><g class="flower-sway"><g class="flower-bloom" data-bloom="1" style="color:#e83e5a"><use href="#brick-flower"/></g></g></g>
        <g transform="translate(300 115)"><g class="flower-sway"><g class="flower-bloom" data-bloom="2" style="color:#ff704d"><use href="#brick-flower"/></g></g></g>
        <g transform="translate(410 166)"><g class="flower-sway"><g class="flower-bloom" data-bloom="3" style="color:#f04b70"><use href="#brick-flower"/></g></g></g>
        <g transform="translate(145 270)"><g class="flower-sway"><g class="flower-bloom" data-bloom="4" style="color:#f15c45"><use href="#brick-flower"/></g></g></g>
        <g transform="translate(455 270)"><g class="flower-sway"><g class="flower-bloom" data-bloom="5" style="color:#d8385a"><use href="#brick-flower"/></g></g></g>
        <g transform="translate(300 253)"><g class="flower-sway"><g class="flower-bloom" data-bloom="6" style="color:#ed4f55"><use href="#brick-flower"/></g></g></g>

        <!-- Wrapper comes in front of the stem ends and gathers them into one bouquet. -->
        <path d="M66 365Q170 412 300 413 430 412 534 365L408 568Q300 603 192 568Z" fill="url(#wrapper)" stroke="#e99389" stroke-width="4" stroke-linejoin="round"/>
        <path d="M72 368Q177 419 300 420L300 583Q238 583 192 568Z" fill="url(#wrapper-fold)" opacity=".82"/>
        <path d="M83 377Q189 426 300 427M517 377Q411 426 300 427" fill="none" stroke="#f8b8a0" stroke-opacity=".65" stroke-width="4"/>
        <path d="M269 478Q300 494 331 478L337 514Q300 529 263 514Z" fill="#e8b34a" stroke="#ffe39a" stroke-width="3"/>
        <path d="M269 485Q237 460 226 488 222 514 277 510L300 502M331 485Q363 460 374 488 378 514 323 510L300 502" fill="#d84b5b" stroke="#f49383" stroke-width="3" stroke-linejoin="round"/>
        <path d="m275 518-13 49 39-26 38 26-14-49" fill="#ae3044" stroke="#e9877d" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="300" cy="502" r="10" fill="#ffd56c" stroke="#fff0ae" stroke-width="3"/>

        <g fill="#f3c36b"><path class="sparkle" d="M91 170q3 10 13 13-10 3-13 13-3-10-13-13 10-3 13-13Z"/><path class="sparkle" d="M509 177q2 8 10 10-8 2-10 10-2-8-10-10 8-2 10-10Z"/><circle class="sparkle" cx="104" cy="294" r="4"/><circle class="sparkle" cx="493" cy="310" r="3"/></g>
      </svg>
      <p class="note"><span class="typed-message" aria-hidden="true">I love you</span><span class="sr-only">I love you. Обичам те.</span></p>
    </main>
    <footer>— Raphael Di Ezmo</footer>
  </div>
<script>
  (() => {
    const bouquet = document.querySelector('.bouquet');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const typedMessage = document.querySelector('.typed-message');
    const phrases = ['I love you', 'Обичам те'];

    if (typedMessage && reducedMotion.matches) {
      typedMessage.textContent = phrases.join(' · ');
    } else if (typedMessage) {
      const pause = (milliseconds) => new Promise((resolve) => window.setTimeout(resolve, milliseconds));
      const typeLoop = async () => {
        let phraseIndex = 0;
        while (true) {
          for (const character of Array.from(phrases[phraseIndex])) {
            typedMessage.textContent += character;
            await pause(105);
          }
          await pause(1250);
          const characters = Array.from(typedMessage.textContent);
          while (characters.length) {
            characters.pop();
            typedMessage.textContent = characters.join('');
            await pause(55);
          }
          await pause(300);
          phraseIndex = (phraseIndex + 1) % phrases.length;
        }
      };
      typedMessage.textContent = '';
      window.setTimeout(typeLoop, 3550);
    }

    if (!bouquet || reducedMotion.matches || !Element.prototype.animate) {
      document.querySelectorAll('.flower-bloom').forEach((flower) => flower.classList.add('is-open'));
      return;
    }

    // Let the bouquet assemble bloom by bloom before the looping sway begins.
    document.querySelectorAll('.flower-bloom').forEach((flower, index) => {
      window.setTimeout(() => flower.classList.add('is-open'), 320 + index * 480);
    });

    // Tiny, floating pollen lights add a little depth around the hand-drawn blooms.
    const ns = 'http://www.w3.org/2000/svg';
    const lights = [
      [75, 132, 2.2], [523, 136, 2.5], [554, 223, 1.8],
      [58, 245, 1.7], [517, 325, 2], [84, 337, 1.5]
    ];

    lights.forEach(([x, y, size], index) => {
      const light = document.createElementNS(ns, 'circle');
      light.setAttribute('cx', x);
      light.setAttribute('cy', y);
      light.setAttribute('r', size);
      light.setAttribute('fill', '#e4b86f');
      light.setAttribute('pointer-events', 'none');
      bouquet.append(light);
      light.animate([
        { transform: 'translate(0 5px) scale(.65)', opacity: .12 },
        { transform: 'translate(3px -7px) scale(1.15)', opacity: .8, offset: .52 },
        { transform: 'translate(-2px -17px) scale(.7)', opacity: .08 }
      ], {
        duration: 3200 + index * 410,
        delay: index * -570,
        iterations: Infinity,
        easing: 'ease-in-out'
      });
    });
  })();
</script>
</body>
</html>
